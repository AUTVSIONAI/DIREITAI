<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Login - DireitaAI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🔍 Debug Login - DireitaAI</h1>
    
    <div>
        <label>Email:</label>
        <input type="email" id="email" value="admin@direitai.com" style="margin: 10px; padding: 5px;">
    </div>
    
    <div>
        <label>Senha:</label>
        <input type="password" id="password" value="admin123456" style="margin: 10px; padding: 5px;">
    </div>
    
    <button onclick="testLogin()" style="margin: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">
        🚀 Testar Login
    </button>
    
    <div id="result" style="margin: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap;"></div>
    
    <script>
        // Configuração do Supabase
        const supabaseUrl = 'https://vussgslenvyztckeuyap.supabase.co'
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ1c3Nnc2xlbnZ5enRja2V1eWFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQyODE5ODUsImV4cCI6MjA2OTg1Nzk4NX0.a3WlLKS1HrSCqWuG80goBsoUaUhtpRsV8mqmTAYpIAo'
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        })
        
        async function testLogin() {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const resultDiv = document.getElementById('result')
            
            resultDiv.textContent = '🔄 Testando login...\n'
            
            try {
                console.log('🔐 Iniciando login para:', email)
                console.log('🔗 URL do Supabase:', supabaseUrl)
                console.log('🔑 Chave anônima (primeiros 20 chars):', supabaseAnonKey.substring(0, 20) + '...')
                
                const startTime = Date.now()
                
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password,
                })
                
                const endTime = Date.now()
                const duration = endTime - startTime
                
                if (error) {
                    console.error('❌ Erro no login:', error)
                    resultDiv.textContent = `❌ Erro no login (${duration}ms):\n${JSON.stringify(error, null, 2)}`
                } else {
                    console.log('✅ Login realizado com sucesso:', data)
                    resultDiv.textContent = `✅ Login realizado com sucesso (${duration}ms):\n${JSON.stringify(data, null, 2)}`
                }
            } catch (error) {
                console.error('❌ Erro geral:', error)
                resultDiv.textContent = `❌ Erro geral:\n${error.message}\n${error.stack}`
            }
        }
        
        // Testar conectividade na inicialização
        window.addEventListener('load', async () => {
            console.log('🌐 Testando conectividade inicial...')
            try {
                const { data: { user } } = await supabase.auth.getUser()
                console.log('👤 Usuário atual:', user)
            } catch (error) {
                console.error('❌ Erro ao verificar usuário:', error)
            }
        })
    </script>
</body>
</html>
